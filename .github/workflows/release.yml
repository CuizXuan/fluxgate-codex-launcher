name: Release Windows Launcher

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build and validate deliverables
        shell: powershell
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          .\build\build-release.ps1 -Version $version -BuildFull

      - name: Validate Full and advanced assets
        shell: powershell
        run: |
          $full = Get-ChildItem release-assets -Filter 'FluxGate-Codex-Full_*.exe' | Select-Object -First 1
          if (-not $full -or $full.Length -lt 100MB) { throw "Full Launcher is missing or unexpectedly small" }
          $assembly = [Reflection.Assembly]::LoadFile($full.FullName)
          $requiredResources = @{
            'FluxGate.CodexLauncher.SetupScript' = 1KB
            'FluxGate.CodexLauncher.Companion' = 1KB
            'FluxGate.CodexLauncher.OfficialCodexArchive' = 100MB
            'FluxGate.CodexLauncher.Notice' = 1KB
            'FluxGate.CodexLauncher.ThirdPartyLicenses' = 1KB
          }
          foreach ($entry in $requiredResources.GetEnumerator()) {
            $stream = $assembly.GetManifestResourceStream($entry.Key)
            if (-not $stream) { throw "Full Launcher resource is missing: $($entry.Key)" }
            try {
              if ($stream.Length -lt $entry.Value) {
                throw "Full Launcher resource is unexpectedly small: $($entry.Key)"
              }
            } finally {
              $stream.Dispose()
            }
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $advanced = @(Get-ChildItem release-assets -Filter '*.zip')
          $unexpected = @($advanced | Where-Object { $_.Name -notmatch '^FluxGate-Codex-(Bridge|Mobile-Web)_' })
          if ($unexpected.Count -gt 0) { throw "Unexpected standalone ZIP found in release assets" }
          foreach ($asset in $advanced) {
            $zip = [IO.Compression.ZipFile]::OpenRead($asset.FullName)
            try {
              $forbidden = @($zip.Entries | Where-Object {
                $_.FullName.Replace('\', '/') -match '(?i)(^|/)(codex(?:-[^/]+)?\.exe|app\.asar)$'
              })
              if ($forbidden.Count -gt 0) {
                throw "Advanced ZIP contains an official Codex payload: $($asset.Name):$($forbidden[0].FullName)"
              }
            } finally {
              $zip.Dispose()
            }
          }

      - name: Publish GitHub Release
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" release-assets/* `
            --title "FluxGate Codex Launcher ${{ github.ref_name }}" `
            --notes "Use FluxGate-Codex-Full for the beginner-ready x64 package with the official Apache-2.0 Codex CLI archive, graphical installer, and native tray companion embedded. It installs or detects official Codex Desktop through Microsoft Store product 9PLM9XGG6VKS and launches it with an isolated FluxGateAI profile; the Store desktop payload itself is not repackaged. The smaller Launcher remains available for online CLI installation, while Bridge and mobile-web ZIPs are advanced assets."
